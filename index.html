<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Traveler</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #6b7280;
      --border: #e3e6eb; --accent: #3b5bdb; --good: #2f9e44; --good-bg: #e6f6ea;
      --block: #c92a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14161b; --surface: #1d2028; --text: #e6e8ec; --muted: #9aa1ad;
        --border: #2c313b; --accent: #748ffc; --good: #51cf66; --good-bg: #1c3324;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14161b; --surface: #1d2028; --text: #e6e8ec; --muted: #9aa1ad;
      --border: #2c313b; --accent: #748ffc; --good: #51cf66; --good-bg: #1c3324;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 16px; }
    nav { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    nav a { color: var(--accent); font-size: 14px; }
    h1 { font-size: 22px; margin: 0; }
    .sub { color: var(--muted); margin: 0 0 20px; }

    .notice {
      background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: end; }
    .toolbar label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
    .toolbar input, .toolbar select {
      font: inherit; font-size: 15px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 40px;
    }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 13px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    th button { all: unset; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
    th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    tr:last-child td { border-bottom: none; }
    tr.best td { background: var(--good-bg); }
    .price-in { width: 80px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
    a.btn {
      display: inline-block; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
      color: var(--accent); text-decoration: none; font-size: 14px; margin-right: 6px; min-height: 36px; line-height: 22px;
    }
    a.btn:hover { background: var(--bg); }
    .auto-price { font-size: 16px; margin-right: 4px; }
    .src { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 8px; }
    .warn { color: #e8590c; font-weight: 600; }
    td.muted { color: var(--muted); font-size: 13px; }
    .state { padding: 24px; color: var(--muted); text-align: center; }
    .error { color: var(--block); }
    .tag { font-size: 12px; color: var(--good); font-weight: 600; margin-left: 6px; }
    button.retry { font: inherit; margin-top: 8px; padding: 8px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <nav>
      <h1>The Traveler</h1>
      <a href="projects.html">Projects dashboard</a>
    </nav>
    <p class="sub" id="route-line">Round trips: Berlin to Buenos Aires</p>

    <div class="notice" id="notice">Loading…</div>

    <form class="toolbar" onsubmit="return false">
      <label>From
        <select id="origin"><option value="BER">Berlin (BER)</option></select>
      </label>
      <label>To
        <select id="dest">
          <option value="BUE">Buenos Aires, all airports (BUE)</option>
          <option value="EZE">Ezeiza (EZE)</option>
          <option value="AEP">Aeroparque (AEP)</option>
        </select>
      </label>
      <label>Departure month
        <input id="month" type="month" value="2027-04">
      </label>
      <label>Nights away
        <input id="nights" type="number" min="1" max="60" value="13" style="width:90px">
      </label>
    </form>

    <section class="stats" aria-label="Summary">
      <div class="stat"><b id="stat-best">–</b><span>Cheapest price</span></div>
      <div class="stat"><b id="stat-date">–</b><span>Cheapest departure date</span></div>
      <div class="stat"><b id="stat-count">–</b><span>Dates with a price</span></div>
      <div class="stat"><b id="stat-est">–</b><span>Typical estimate (not live)</span></div>
    </section>

    <div class="card" id="list" aria-live="polite"><div class="state">Loading…</div></div>
  </main>

  <script>
    const ENDPOINT = "/.netlify/functions/flights";
    const listEl = document.getElementById("list");
    const $ = (id) => document.getElementById(id);
    let data = null;
    let sortBy = "date"; // "date" | "price"

    function esc(v) {
      return String(v).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Prices you type are kept in this browser only.
    function storeKey() { return `traveler:${data.origin}-${data.dest}:${data.month}:${data.nights}`; }
    function readSaved() {
      try { return JSON.parse(localStorage.getItem(storeKey()) || "{}"); } catch (e) { return {}; }
    }
    function writeSaved(obj) {
      try { localStorage.setItem(storeKey(), JSON.stringify(obj)); } catch (e) { /* storage blocked: still works for this visit */ }
    }
    let saved = {};

    // Treat 0 and negative as "not set" so a stray input doesn't claim to be the cheapest.
    function savedPrice(dep) {
      const v = saved[dep];
      return typeof v === "number" && v > 0 ? v : null;
    }
    function priceOf(row) {
      const s = savedPrice(row.departure);
      if (s != null) return s;
      return row.price != null && row.price > 0 ? row.price : null;
    }
    // Fares with a different stay length are shown but not counted as "cheapest".
    function counts(row) {
      return savedPrice(row.departure) != null || (row.price != null && row.price > 0 && row.stayMatch !== false);
    }
    function money(n) { return "€" + Math.round(n).toLocaleString("en-GB"); }

    function render() {
      const priced = data.rows.map((r) => ({ r, p: priceOf(r) }));
      const withPrice = priced.filter((x) => x.p != null && counts(x.r));
      const best = withPrice.length ? withPrice.reduce((a, b) => (b.p < a.p ? b : a)) : null;

      $("stat-best").textContent = best ? money(best.p) : "–";
      $("stat-date").textContent = best ? best.r.departure : "–";
      $("stat-count").textContent = `${withPrice.length} / ${data.count}`;
      $("stat-est").textContent = data.estimate ? `€${data.estimate.min}–${data.estimate.max}` : "–";

      const rows = priced.slice();
      if (sortBy === "price") {
        rows.sort((a, b) => (a.p == null) - (b.p == null) || a.p - b.p);
      }

      const body = rows.map(({ r, p }) => `
        <tr class="${best && r.departure === best.r.departure ? "best" : ""}">
          <td>${esc(r.weekday)} ${esc(r.departure)}${best && r.departure === best.r.departure ? '<span class="tag">Cheapest</span>' : ""}</td>
          <td>${esc(r.return)}</td>
          <td>${savedPrice(r.departure) == null && r.price != null && r.price > 0
                ? `<strong class="auto-price">${money(r.price)}</strong><span class="src">${r.source === "api" ? "auto" : "saved"}</span>`
                : ""}
              <input class="price-in" type="number" min="0" inputmode="numeric"
                placeholder="${r.price != null && r.price > 0 ? "Edit" : "€"}"
                aria-label="Price in euros for departure ${esc(r.departure)}"
                data-date="${esc(r.departure)}" value="${savedPrice(r.departure) != null ? savedPrice(r.departure) : ""}"></td>
          <td class="muted">${r.price != null && r.source === "api" ? `${r.stayMatch === false ? `<span class="warn">Different stay: back ${esc(r.apiReturn)}, </span>` : ""}${r.stayNights} nights${r.airline ? ", " + esc(r.airline) : ""}${r.transfers != null ? ", " + r.transfers + " stop" + (r.transfers === 1 ? "" : "s") : ""}` : ""}</td>
          <td>
            <a class="btn" href="${esc(r.kayak)}" target="_blank" rel="noopener noreferrer">Kayak</a>
            <a class="btn" href="${esc(r.google)}" target="_blank" rel="noopener noreferrer">Google Flights</a>
          </td>
        </tr>`).join("");

      listEl.innerHTML = `
        <table>
          <thead><tr>
            <th><button type="button" data-sort="date">Departure${sortBy === "date" ? " ▲" : ""}</button></th>
            <th>Return</th>
            <th><button type="button" data-sort="price">Price (round trip)${sortBy === "price" ? " ▲" : ""}</button></th>
            <th>Details</th>
            <th>Check live price</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    listEl.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-sort]");
      if (b) { sortBy = b.dataset.sort; render(); }
    });
    listEl.addEventListener("change", (e) => {
      const input = e.target.closest("input.price-in");
      if (!input) return;
      const v = input.value.trim();
      const n = Number(v);
      if (v === "" || !Number.isFinite(n) || n <= 0) delete saved[input.dataset.date];
      else saved[input.dataset.date] = n;
      writeSaved(saved);
      render();
    });

    async function load() {
      const params = new URLSearchParams({
        origin: $("origin").value, dest: $("dest").value,
        month: $("month").value, nights: $("nights").value,
      });
      listEl.innerHTML = '<div class="state">Loading…</div>';
      try {
        const res = await fetch(`${ENDPOINT}?${params}`, { headers: { Accept: "application/json" } });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
        data = body;
        saved = readSaved();
        $("route-line").textContent =
          `Round trips: ${data.origin} to ${data.dest}, ${data.nights} nights, departing ${data.month}`;
        const msgs = {
          ok: "Prices marked auto are the cheapest recent round-trip fares found by Aviasales (cached, not a booking quote). " +
              "Dates without a price had no recent data: check Kayak or Google Flights and type it in.",
          no_token: "Automatic prices are off (no API token set on the server). Open Kayak or Google Flights for a date and type the price you see.",
          error: "Automatic prices are unavailable right now. Check Kayak or Google Flights and type the price you see.",
        };
        let msg = msgs[data.autoPrices] || msgs.no_token;
        if (data.autoPrices === "ok") {
          msg = `Aviasales returned ${data.apiFares} recent fares; ${data.apiMatchedDays} dates match a ~${data.nights}-night stay. ` + msg;
        }
        $("notice").textContent = msg;
        render();
      } catch (err) {
        $("notice").textContent = "Something went wrong.";
        listEl.innerHTML = `<div class="state error">Could not load flights (${esc(err.message)}).
          <div><button class="retry" id="retry" type="button">Try again</button></div></div>`;
        $("retry").addEventListener("click", load);
      }
    }

    ["origin", "dest", "month", "nights"].forEach((id) => $(id).addEventListener("change", load));
    load();
  </script>
</body>
</html>
